                    <!-- Sale Summary and Payment -->
                    <div class="scanner-container" style="flex: 1; min-width: 500px; background: #e9ecef; padding: 15px; border-radius: 8px; margin-bottom: 0;">
                        <style>
                            .compact-summary-grid .form-group { margin-bottom: 0; flex: 1; }
                            .compact-summary-grid label { font-size: 14px; margin-bottom: 4px; font-weight: 500; display: block; }
                            .compact-summary-grid input[type="number"], .compact-summary-grid input[type="text"], .compact-summary-grid select { padding: 10px 15px; font-size: 20px !important; font-weight: bold; height: 48px; width: 100%; box-sizing: border-box; }
                            .compact-summary-grid .combobox-input { padding: 10px 15px; font-size: 20px !important; font-weight: bold; height: 48px; width: 100%; box-sizing: border-box; }
                            #cartSubtotal, #cartTaxableAmount, #cartCGST, #cartSGST, #cartIGST { font-size: 20px !important; }
                            #cartTotal { font-size: 24px !important; }
                        </style>
                        <h4 style="margin: 0 0 15px 0; font-size: 22px; font-weight: bold; color: #004085; display: flex; align-items: center; gap: 8px;">💳 Sale Summary & Payment</h4>
                        
                        <div style="display: flex; gap: 15px;">
                            <!-- Form Flex Layout -->
                            <div class="compact-summary-grid" style="flex: 1; display: flex; flex-direction: column; gap: 15px; align-items: stretch;">
                                
                                <!-- Row 1 -->
                                <div style="display: flex; gap: 10px; align-items: flex-end; width: 100%;">
                                    <div class="form-group">
                                        <label>Subtotal (₹)</label>
                                        <input type="number" id="cartSubtotal" step="0.01" readonly style="font-weight: bold; font-size: 18px;">
                                    </div>
                                    <div class="form-group">
                                        <label>Total Item Disc. (₹)</label>
                                        <input type="number" id="cartTotalItemDiscount" step="0.01" readonly style="font-weight: bold; color: red;">
                                    </div>
                                    <div class="form-group">
                                        <label>Ext.Discount (₹)</label>
                                        <input type="number" id="discountAmount" min="0" step="0.01" value="0" onchange="updateDiscount()" placeholder="0" onfocus="this.select()" onkeydown="if(event.key==='Enter' && !event.ctrlKey && !event.metaKey && !event.altKey && !event.shiftKey){event.preventDefault(); document.getElementById('courierCharges').focus();}">
                                    </div>
                                    <div class="form-group">
                                        <label>Courier Charges (₹)</label>
                                        <input type="number" id="courierCharges" min="0" step="0.01" value="0" onchange="updateDiscount()" placeholder="0" onfocus="this.select()" onkeydown="if(event.key==='Enter' && !event.ctrlKey && !event.metaKey && !event.altKey && !event.shiftKey){event.preventDefault(); document.getElementById('paymentMethod').focus();}">
                                    </div>
                                </div>
                                
                                <!-- Row 2 -->
                                <div style="display: flex; gap: 10px; align-items: flex-end; width: 100%;">
                                    <div class="form-group gst-field" id="summary-taxable" style="display:none;">
                                        <label>Taxable Amount (₹)</label>
                                        <input type="number" id="cartTaxableAmount" step="0.01" readonly style="font-weight: bold;">
                                    </div>
                                    <div class="form-group gst-field" id="summary-cgst" style="display:none;">
                                        <label>CGST (₹)</label>
                                        <input type="number" id="cartCGST" step="0.01" readonly style="font-weight: bold;">
                                    </div>
                                    <div class="form-group gst-field" id="summary-sgst" style="display:none;">
                                        <label>SGST (₹)</label>
                                        <input type="number" id="cartSGST" step="0.01" readonly style="font-weight: bold;">
                                    </div>
                                    <div class="form-group gst-field" id="summary-igst" style="display:none;">
                                        <label>IGST (₹)</label>
                                        <input type="number" id="cartIGST" step="0.01" readonly style="font-weight: bold;">
                                    </div>
                                    <div class="form-group">
                                        <label>Total Amount (₹)</label>
                                        <input type="number" id="cartTotal" step="0.01" readonly style="font-weight: bold; font-size: 20px; color: #28a745;">
                                    </div>
                                </div>

                                <div style="display:none;">
                                    <select id="saleTaxType" class="form-control" onchange="updateCartDisplay()">
                                        <option value="auto">Auto (Detect from State)</option>
                                        <option value="intra">Intra-State (CGST + SGST)</option>
                                        <option value="inter">Inter-State (IGST)</option>
                                    </select>
                                </div>
                                
                                <!-- Row 3 -->
                                <div style="display: flex; gap: 10px; align-items: flex-end; width: 100%;">
                                    <div class="form-group">
                                        <label>Payment Method</label>
                                        <select id="paymentMethod" class="form-control" onchange="togglePaymentFields()"  style="padding: 10px 15px; font-size: 20px; font-weight: bold; height: 48px; width: 100%; border: 1px solid #ced4da; border-radius: 4px; box-sizing: border-box; background: white;">
                                            <option value="cash" selected>Cash Only</option>
                                            <option value="card">Card</option>
                                            <option value="upi">UPI</option>
                                            <option value="credit">Credit</option>
                                            <option value="mixed">Mixed (Cash + UPI/Balance)</option>
                                        </select>
                                    </div>
                                    <div class="form-group" id="customerAmountGroup" style="display: none; position: relative;">
                                        <label>Cash Received (₹) <span style="color: red;">*</span></label>
                                        <input type="number" id="customerAmount" step="0.01" onchange="calculateChange()" oninput="calculateChange()" placeholder="Enter amount" required onfocus="this.select()" onkeydown="if(event.key==='Enter' && !event.ctrlKey && !event.metaKey && !event.altKey && !event.shiftKey){event.preventDefault(); document.getElementById('btnCompleteSale').focus();}">
                                        <small id="cashAmountError" style="position: absolute; left: 0; bottom: -18px; font-size: 11px; color: red; display: none; white-space: nowrap;"></small>
                                    </div>
                                    <div class="form-group" id="otherPaymentGroup" style="display: none;">
                                        <label>UPI/Balance Amount (₹)</label>
                                        <input type="number" id="otherPaymentAmount" step="0.01" onchange="calculateChange()" oninput="calculateChange()" placeholder="Amount" value="0">
                                    </div>
                                    <div class="form-group" id="changeAmountGroup" style="display: none; position: relative;">
                                        <label>Give (₹)</label>
                                        <input type="number" id="changeAmount" step="0.01" readonly style="font-weight: bold; color: #dc3545;">
                                        <div id="negativeChangeInfo" style="position: absolute; left: 0; bottom: -18px; font-size: 11px; color: #dc3545; display: none; white-space: nowrap;">
                                            <span id="negativeChangeText"></span> | Count: <span id="negativeChangeCount">0</span>
                                        </div>
                                    </div>
                                </div>
                                
                                <div id="creditPaymentGroup" style="display: none; padding: 15px; background: #fff5f5; border: 1px solid #fed7d7; border-radius: 8px; width: 100%; box-sizing: border-box;">
                                    <h4 style="margin: 0 0 15px 0; color: #c53030; font-size: 15px; border-bottom: 1px solid #fed7d7; padding-bottom: 5px;">💳 Credit Details</h4>
                                    
                                    <div style="display: flex; gap: 15px; align-items: start; width: 100%;">
                                        <div class="form-group">
                                            <label>Initial Amount Paid (₹)</label>
                                            <input type="number" id="creditAmountPaid" step="0.01" class="form-control" onchange="calculateChange()" oninput="calculateChange()" placeholder="e.g. 1000" value="0">
                                        </div>
                                        <div class="form-group">
                                            <label>Outstanding Balance (₹)</label>
                                            <input type="text" id="creditOutstanding" class="form-control" readonly style="font-weight: bold; color: #c53030; background: #fff5f5; border: 1px solid #fed7d7;" value="₹0.00">
                                        </div>
                                        
                                        <div class="form-group" id="inlineAdvancePaymentSection" style="display: block;">
                                            <label>Initial Payment Method</label>
                                            <select id="creditPaymentMethod" class="form-control" onchange="calculateChange()">
                                                <option value="cash">Cash</option>
                                                <option value="upi">UPI</option>
                                                <option value="card">Card</option>
                                                <option value="bank">Bank Transfer</option>
                                                <option value="cheque">Cheque</option>
                                                <option value="other">Other</option>
                                            </select>
                                        </div>
                                        <div class="form-group" id="inlineReferenceGroup" style="display: none;">
                                            <label>Reference No. (Optional)</label>
                                            <input type="text" id="creditReference" class="form-control" placeholder="UPI Ref / Cheque No">
                                        </div>
                                        <div class="form-group">
                                            <label>Due Date (Optional)</label>
                                            <input type="date" id="creditDueDate" class="form-control">
                                        </div>
                                    </div>
                                </div>
                            </div>
                            
                            <!-- Action Buttons -->
                            <div style="display: flex; flex-direction: column; gap: 10px; min-width: 160px; justify-content: flex-end;">
                                <button type="button" id="btnCompleteSale" class="btn btn-success" onclick="completeSale()" onkeydown="if(event.key==='Enter'){event.preventDefault(); this.click();}" style="height: 48px; white-space: nowrap; font-size: 18px; font-weight: bold;">✅ Complete Sale</button>
                                <button type="button" id="btnHoldSale" class="btn btn-warning" onclick="holdSale()" onkeydown="if(event.key==='Enter'){event.preventDefault(); this.click();}" style="height: 48px; color: #856404; font-weight: bold; white-space: nowrap; font-size: 18px;">⏸️ Hold Sale</button>
                                <button type="button" id="btnClearCart" class="btn btn-cart-remove" onclick="clearCart()" onkeydown="if(event.key==='Enter'){event.preventDefault(); this.click();}" style="height: 48px; background-color: #dc3545; color: white; white-space: nowrap; font-size: 18px; font-weight: bold;">🗑️ Clear Cart</button>
                            </div>
                        </div>
                    </div>
                </div>
