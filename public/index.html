<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Sales App">
    <meta name="theme-color" content="#f12711">
    <meta name="description" content="Inventory & Sales Management System for salesapp Stationery Store">

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json">

    <!-- App Icons -->
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png">
    <link rel="apple-touch-icon" href="/icon-192.png">

    <title>Login - Business Management System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5af19 0%, #f12711 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            max-width: 450px;
            width: 100%;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-header {
            background: linear-gradient(135deg, #f5af19 0%, #f12711 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
        }

        .login-header h1 {
            font-size: 2em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .login-header p {
            opacity: 0.95;
            font-size: 1.1em;
        }

        .store-icon {
            font-size: 3em;
            margin-bottom: 15px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        .login-form {
            padding: 40px 30px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #495057;
            font-weight: 600;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group input {
            width: 100%;
            padding: 15px;
            border: 2px solid #dee2e6;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s;
            background: #f8f9fa;
        }

        .form-group input:focus {
            outline: none;
            border-color: #f12711;
            background: white;
            box-shadow: 0 0 0 3px rgba(241, 39, 17, 0.1);
        }

        .btn-login {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #f5af19 0%, #f12711 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(241, 39, 17, 0.4);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #f5c6cb;
            display: none;
            animation: shake 0.5s;
        }

        .error-message.show {
            display: block;
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-10px);
            }

            75% {
                transform: translateX(10px);
            }
        }

        .loading-spinner {
            display: none;
            text-align: center;
            margin-top: 10px;
        }

        .loading-spinner.show {
            display: block;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #f12711;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .footer-text {
            text-align: center;
            margin-top: 20px;
            color: #6c757d;
            font-size: 14px;
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .login-header h1 {
                font-size: 1.6em;
            }

            .store-icon {
                font-size: 2.5em;
            }

            .login-form {
                padding: 30px 20px;
            }
        }

        /* Modal Styles */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal-card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            max-width: 400px;
            width: 90%;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            animation: slideIn 0.3s ease;
        }

        .modal-title {
            font-size: 1.2em;
            font-weight: bold;
            margin-bottom: 15px;
            color: #333;
        }

        .modal-text {
            color: #666;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .btn-modal {
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            flex: 1;
        }

        .btn-confirm {
            background: #f12711;
            color: white;
        }

        .btn-cancel {
            background: #e9ecef;
            color: #333;
        }

        .waiting-spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #f12711;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
    </style>
</head>

<body>
    <div class="login-container">
        <div class="login-header">
            <div class="store-icon">🎨</div>
            <h1>Welcome</h1>
            <p>Inventory & Sales Management</p>
        </div>

        <div class="login-form">
            <div id="errorMessage" class="error-message"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" required
                        autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required
                        autocomplete="current-password">
                </div>

                <button type="submit" id="loginBtn" class="btn-login">
                    Sign In
                </button>

                <div class="loading-spinner" id="loadingSpinner">
                    <div class="spinner"></div>
                    <p style="margin-top: 10px; color: #6c757d;">Signing in...</p>
                </div>
            </form>

            <div class="footer-text">
                Internal Use Only
            </div>
        </div>
    </div>
    </div>






    <!-- Session Blocked Modal -->
    <div id="conflictModal" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-title">⛔ Login Blocked</div>
            <div class="modal-text" id="conflictText">
                This account is currently active on another device.<br><br>
                To prevent data loss (e.g. interrupting a sale), <b>you cannot login</b> until the other device logs out
                or is idle for 5 minutes.
            </div>
            <div class="modal-buttons">
                <!-- <button class="btn-modal btn-cancel" onclick="closeConflictModal()">Close</button> -->
                <button class="btn-modal btn-confirm" id="btnLoginAnyway">Check Again</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { login, checkAuth } from './auth.js';

        // Check if user is already logged in
        checkAuth(false).then(user => {
            if (user) {
                // User is already logged in, redirect to main app
                window.location.href = 'final.html';
            }
        });

        const loginForm = document.getElementById('loginForm');
        const errorMessage = document.getElementById('errorMessage');
        const loginBtn = document.getElementById('loginBtn');
        const loadingSpinner = document.getElementById('loadingSpinner');

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.add('show');
            setTimeout(() => {
                errorMessage.classList.remove('show');
            }, 5000);
        }

        function setLoading(isLoading) {
            if (isLoading) {
                loginBtn.disabled = true;
                loginBtn.style.display = 'none';
                loadingSpinner.classList.add('show');
            } else {
                loginBtn.disabled = false;
                loginBtn.style.display = 'block';
                loadingSpinner.classList.remove('show');
            }
        }

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            if (!email || !password) {
                showError('Please enter both email and password.');
                return;
            }

            setLoading(true);

            try {
                const result = await login(email, password);

                if (result.success) {
                    // Login successful, redirect to main app
                    window.location.href = 'final.html';
                } else if (result.requiresConfirmation) {
                    setLoading(false);
                    showConflictModal(email, password, result.otherDevice);
                } else {
                    // Show error message
                    showError(result.error);
                    setLoading(false);
                }
            } catch (error) {
                console.error('Login error:', error);
                showError('An unexpected error occurred. Please try again.');
                setLoading(false);
            }
        });

        // Auto-focus email field
        document.getElementById('email').focus();

        // Register Service Worker for PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/service-worker.js')
                    .then(registration => {
                        console.log('Service Worker registered:', registration.scope);
                    })
                    .catch(error => {
                        console.log('Service Worker registration failed:', error);
                    });
            });
        }

        // --- Conflict Modal Logic ---
        const conflictModal = document.getElementById('conflictModal');
        const conflictText = document.getElementById('conflictText');
        const btnLoginAnyway = document.getElementById('btnLoginAnyway'); // Acts as "Retry" now

        // Store credentials briefly to retry login
        let storedEmail = '';
        let storedPassword = '';

        window.closeConflictModal = () => {
            conflictModal.classList.remove('show');
            storedEmail = '';
            storedPassword = '';
        };

        function showConflictModal(email, password, otherDevice) {
            storedEmail = email;
            storedPassword = password;
            conflictText.innerHTML = `Account is active on <b>${otherDevice}</b>.<br><br>Please logout from that device before logging in here.<br><small>(Auto-unlocks in ~5 mins if idle)</small>`;
            conflictModal.classList.add('show');
        }

        btnLoginAnyway.addEventListener('click', async () => {
             if(!storedEmail || !storedPassword) return;
             
             conflictModal.classList.remove('show');
             setLoading(true);
             
             try {
                 // Retry WITHOUT Force (Just Check Again)
                 // If the user logged out or timed out, this will succeed.
                 // If still active, it will show the modal again.
                 const result = await login(storedEmail, storedPassword, false);
                 
                 if (result.success) {
                      window.location.href = 'final.html';
                 } else if (result.requiresConfirmation) {
                      // Still blocked
                      setLoading(false);
                      showConflictModal(storedEmail, storedPassword, result.otherDevice);
                 } else {
                      showError(result.error);
                      setLoading(false);
                 }
             } catch (e) {
                 showError(e.message);
                 setLoading(false);
             }
        });
    </script>
</body>

</html>
